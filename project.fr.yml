# The French resources, merged into project.yml only when DISTRICT_FRENCH is set to a
# true value (YES, true, 1) in the environment of `xcodegen generate`. Without it,
# XcodeGen skips this file and the built .app holds no fr-CA.lproj, which the release
# workflow checks.
#
# ⛔ IT ONLY ADDS. XcodeGen merges an include additively: this `sources` array is
# appended to the DistrictAI target's own, so fr-CA joins knownRegions and each file in
# App/Localization/fr-CA.lproj is copied into the bundle's fr-CA.lproj. An include can
# never remove an `excludes`, which is why the French tables live in App/Localization
# and not beside App/Resources/en.lproj.
#
# ⚠️ fr-CA.lproj AND NO fr.lproj. iOS resolves fr-FR, fr-BE and fr-CH to fr-CA when it
# is the only French; with both, those devices would get `fr`.
#
# The files are generated: `python3 scripts/gen-l10n.py` (from l10n/push.toml and
# l10n/infoplist.toml). The app's own screens read their French from Generated/Copy.swift
# and follow AppL10n, which answers French only when this bundle ships a French
# localization.
targets:
  DistrictAI:
    sources:
      - path: App/Localization
        buildPhase: resources
