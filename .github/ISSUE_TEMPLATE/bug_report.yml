name: 🐞 Bug report
description: Report a reproducible bug in the District AI iOS app or in building it from source.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you start, please [search existing issues](https://github.com/distronode-corporation/district-ios/issues?q=is%3Aissue):** it may already be reported or fixed.

        ⛔ **Do not report a security vulnerability here.** Report it privately through [Report a vulnerability](https://github.com/distronode-corporation/district-ios/security/advisories/new) instead; see [SECURITY.md](https://github.com/distronode-corporation/district-ios/blob/main/SECURITY.md).

        ⚠️ **Nothing you paste here is private.** Screenshots and logs from a signed-in app can show caller names, phone numbers, messages and workspace names. Redact anything you would not publish, and never paste a token or a session.

        Questions about an account, a phone number or billing go to [District AI support](https://www.distronode.com/support), not here.
  - type: checkboxes
    id: prechecks
    attributes:
      label: Before submitting
      options:
        - label: I've searched existing issues and this isn't a duplicate.
          required: true
        - label: I'm on the latest App Store release, or building from the latest `main`.
          required: true
        - label: This is not a security issue (those go to the private report linked above).
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What's the bug?
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps, so a maintainer can reproduce it.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where does it go wrong?
      options:
        - Signing in or out
        - Placing or answering a call
        - Meeting rooms
        - Inbox and messages
        - Calls list or contacts
        - Notifications
        - Settings or account
        - Accessibility (VoiceOver, larger text)
        - iPad layout (sidebar, split view, keyboard, pointer)
        - Building or testing from source
        - Something else
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Where did the app come from?
      options:
        - App Store
        - Built from source
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version, or commit if built from source
      placeholder: "1.2, or a commit SHA"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and iOS or iPadOS version
      placeholder: iPhone 15, iOS 26.2 (or a simulator, and its runtime)
    validations:
      required: true
  - type: input
    id: xcode
    attributes:
      label: Xcode version (if building from source)
      placeholder: "`xcodebuild -version`"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Build or test output, if relevant. Read it before pasting.
      render: text
