name: Release credentials
description: >-
  A short-lived Google Cloud access token for the release service account, which can read
  exactly the release secrets in Secret Manager. The one place the workload identity
  provider and the service account are named, for release.yml and submit.yml. The job
  needs `id-token: write` and the `release` environment.

# ⛔ The provider admits only this repository, the `release` environment and its refs
# (main and v* tags); a job without them gets no token, whatever it asks for here.
outputs:
  access_token:
    description: The access token, for scripts/gsm-secret.sh as GSM_ACCESS_TOKEN.
    value: ${{ steps.gcp.outputs.access_token }}

runs:
  using: composite
  steps:
    - name: Authenticate to Google Cloud
      id: gcp
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: projects/409911651910/locations/global/workloadIdentityPools/github-pool/providers/github-actions
        service_account: gh-ios-release@distronode.iam.gserviceaccount.com
        token_format: access_token
        create_credentials_file: false
