version: 2

# Every `uses:` in .github/workflows is pinned to a commit SHA with a `# vX.Y.Z`
# comment. That is right for supply-chain safety and wrong for noticing a security fix,
# because a pinned SHA never moves on its own; the `github-actions` entry turns each pin
# into a pull request and rewrites both the SHA and the comment. `/` covers the workflows
# only, so the composite actions under .github/actions, which pin google-github-actions/auth,
# are listed too.
#
# `cooldown` holds a version update back until the release is a week old, so a
# compromised publish that is yanked within days never reaches a pull request here. It
# does not delay security updates.
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor:
        update-types: [minor, patch]

  # DistrictCore's one dependency (apple/swift-crypto, and swift-asn1 through it), pinned
  # `exact:` in Package.swift with Package.resolved committed. CI's Package.resolved guard
  # allows exactly those two pins, so a bump that adds a third package fails its PR.
  #
  # ⚠️ There is deliberately no `swift` entry for `/`. The repository root holds no
  # Package.swift: the app's own packages (LiveKit, Sentry) are declared `exactVersion` in
  # project.yml, which Dependabot cannot read, so an entry there would only report
  # "dependency file not found" on every run. Those pins are bumped by hand.
  - package-ecosystem: swift
    directory: /Packages/DistrictCore
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
