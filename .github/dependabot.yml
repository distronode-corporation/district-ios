version: 2

# Every `uses:` in .github/workflows is pinned to a commit SHA with a `# vX.Y.Z`
# comment. That is right for supply-chain safety and wrong for noticing a security fix,
# because a pinned SHA never moves on its own; the `github-actions` entry turns each pin
# into a pull request and rewrites both the SHA and the comment. `/` covers the workflows
# only, so the composite actions under .github/actions, which pin google-github-actions/auth,
# are listed too.
#
# `cooldown` holds a version update back until the release is a week old, so a
# compromised publish that is yanked within days never reaches a pull request here. It
# does not delay security updates.
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor:
        update-types: [minor, patch]

# ⚠️ THERE IS DELIBERATELY NO `swift` ENTRY. The repository holds no Package.swift and no
# committed .xcodeproj: every Swift package the app uses (DistrictCore from
# district-core-swift, swift-asn1 under it, LiveKit, Sentry) is declared `exactVersion`
# in project.yml, which Dependabot cannot read, so an entry would only report "dependency
# file not found" on every run. Those pins are bumped by hand. DistrictCore's own
# dependency (apple/swift-crypto) is watched by Dependabot in district-core-swift, and
# reaches this app as a new core release and a bump here.
