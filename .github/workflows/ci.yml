name: CI

# The Linux-testable half of the app (model, network, data, auth and call logic) is the
# DistrictCore package, which lives in its own repository, district-core-swift, and is
# tested there; project.yml pins the release this app builds against. Here, `verify`
# formats and lints App/ in the pinned swift:6.2.4 image, and `app` builds the SwiftUI
# app with Xcode, which resolves that pinned release, and runs its XCTest bundles on an
# iPhone and an iPad simulator. `gitleaks` scans the history for secrets and `zizmor`
# runs static analysis on these workflows. `dependency graph` submits the packages Xcode
# resolved to GitHub's dependency graph, which cannot see them in an XcodeGen project.
#
# No job reads a secret, so pull requests from forks run the same checks as `main`
# (all but `dependency graph`, which needs a token that can write).
# Releases are not built here: release.yml builds, signs and uploads them from a protected
# `v*` tag or a dispatch on main. `release-scripts` below tests that workflow's scripts on
# every pull request, with stubs and no credentials.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_app:
        description: Run the macOS app job on this dispatch (needed only if the repository is private)
        type: boolean
        default: false

# Least privilege at the top level, so a job added later starts read-only.
permissions:
  contents: read

# Per ref and per trigger. Only pull requests cancel in flight: a superseded PR run is
# waste, a superseded main run is history. A manual dispatch gets its own group, because a
# group holds one pending run at most, and a push arriving behind a pending dispatch would
# cancel it: the proof run would vanish because someone pushed a docs change.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (Linux)
    runs-on: ubuntu-24.04
    # ⚠️ PINNED BY TAG AND DIGEST, the same reference as ci/Dockerfile. `6.2.4` is
    # rebuilt when its Ubuntu base gets a security update, so the tag alone moves. The
    # Linux toolchain is paired with the Xcode the `app` job selects (Swift 6.2): a
    # Linux compiler ahead of Xcode's compiles code the app target then rejects. Move
    # both together, or neither.
    container: swift:6.2.4@sha256:29b983751c605c2d3102d2ab93438c6e0cadf110d9d2aa6e929b6dec9dcb7cbc
    timeout-minutes: 30
    env:
      # Same versions, URLs and SHA-256 sums as ci/Dockerfile. Bump both together.
      SWIFTLINT_VERSION: 0.65.1
      SWIFTLINT_SHA256: caeed6f4a679c35539ffaf124f6c4ab4a8416917f7d8796279dc52b74026059d
      SWIFTFORMAT_VERSION: 0.63.0
      SWIFTFORMAT_SHA256: b4a3cbb8c852a0baaf9adf853e221ff1dabf921a3d8957a602e0bda3af8470f1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # libxml2 is for the dynamic SwiftLint binary, which otherwise dies at startup on a
      # missing libxml2.so.2.
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl unzip git libxml2
          rm -rf /var/lib/apt/lists/*

      # ⛔ THE DYNAMIC `swiftlint`, NOT THE `swiftlint-static` BESIDE IT IN THE ZIP. The
      # static build has SourceKit compiled out, skips every rule that needs it with a
      # warning, and still reports "0 violations". The dynamic build loads sourcekitd
      # from the Swift toolchain in this image and runs the full rule set.
      # The checksum is what tells the real archive from a redirect page or a
      # substituted asset; an unredirected curl can save HTML and exit 0.
      - name: Install SwiftLint and SwiftFormat
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip"
          echo "${SWIFTLINT_SHA256}  swiftlint.zip" | sha256sum -c -
          unzip -q swiftlint.zip -d swiftlint-extract
          install -m 0755 swiftlint-extract/swiftlint /usr/local/bin/swiftlint
          curl -fsSL -o swiftformat.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat_linux.zip"
          echo "${SWIFTFORMAT_SHA256}  swiftformat.zip" | sha256sum -c -
          unzip -q swiftformat.zip -d swiftformat-extract
          install -m 0755 swiftformat-extract/swiftformat_linux /usr/local/bin/swiftformat
          rm -rf swiftlint.zip swiftlint-extract swiftformat.zip swiftformat-extract

      # Prove the toolchain before doing work, so a wrong image fails with the reason
      # rather than with a confusing compiler error later.
      - name: Toolchain
        run: |
          swift --version
          swiftlint version
          swiftformat --version

      # `--lint` writes nothing and exits non-zero on any file that would change.
      - name: swiftformat --lint
        run: swiftformat --lint .

      # `--strict` promotes every warning to an error. A warning tier in CI is a tier
      # nobody reads.
      - name: swiftlint --strict
        run: swiftlint --strict

  release-scripts:
    name: release scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Stub-driven tests of the release lane: the archive script's refusals and exact
      # xcodebuild argv, the preflight's tag and build-number rules, the key fetch's
      # masking, the GitHub Release's gates and body, and the App Store Connect helper's
      # release notes, ES256 signature, error handling, submission decisions and store
      # state. No network, no secret.
      - name: Release script tests
        run: |
          bash scripts/archive-imac.test.sh
          bash scripts/release-preflight.test.sh
          bash scripts/asc-key.test.sh
          bash scripts/github-release.test.sh
          python3 scripts/asc_release_test.py

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the whole history, not just the tip

      # gitleaks/gitleaks-action needs a paid GITLEAKS_LICENSE for an organization
      # repository. The CLI itself is free (MIT), so install a pinned version and run it,
      # the same way district-scheduler does. `go install` of a tagged module is checked
      # against the Go checksum database. `.gitleaks.toml` is picked up from the root.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: false

      # `--log-opts="HEAD"`: the history reachable from this checkout only. A full-depth
      # checkout also fetches every other branch, and without it one open pull request's
      # finding reds every other pull request's run. A push to main still scans all of main.
      - name: gitleaks git
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --no-banner --redact -v --log-opts="HEAD" .

  # Static analysis of these workflows. Annotations mode, not SARIF: zizmor reports a
  # finding as an annotation and FAILS the job, rather than only filing a code scanning alert.
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true

  app:
    name: app (${{ matrix.device }})
    # Runs on every push and pull request. This guard and the run_app input matter only if
    # the repository is ever private again: the free plan bills a private repository's
    # macOS minutes at ten times the Linux rate, so there this job runs only when started
    # by hand (workflow_dispatch with run_app).
    if: ${{ !github.event.repository.private || (github.event_name == 'workflow_dispatch' && inputs.run_app) }}
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    env:
      DEVICE: ${{ matrix.device }}
      # Recommended by xcbeautify: without it xcodebuild buffers its output when piped.
      NSUnbufferedIO: "YES"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Xcode 26.3, asserted, plus the pinned XcodeGen and the generated project. The pins
      # live in the action, shared with codeql.yml and release.yml.
      - name: Xcode and XcodeGen
        id: toolchain
        uses: ./.github/actions/macos-toolchain # zizmor: ignore[self-repository]

      # Recorded so a runner image change is attributable from the job log.
      - name: Toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
          xcbeautify --version

      # Where the DistrictCore, LiveKit, WebRTC and Sentry packages land. Every remote
      # package, swift-asn1 under DistrictCore included, is pinned `exactVersion` in
      # project.yml, so project.yml alone is the key.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: SourcePackages
          key: sourcepackages-xcode-${{ steps.toolchain.outputs.xcode-version }}-${{ hashFiles('project.yml') }}

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project DistrictAI.xcodeproj \
            -scheme DistrictAI \
            -clonedSourcePackagesDirPath SourcePackages

      # The resolved graph, for the `dependency graph` job to submit from Linux. Uploaded
      # straight after resolution, so the snapshot is what Xcode resolved even when a
      # later step fails.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Both devices resolve the same graph; one upload is enough.
        if: matrix.device == 'iPhone'
        with:
          name: package-resolved
          path: DistrictAI.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: error
          retention-days: 7

      # ⚠️ PROVES THE GRAPH RESOLVED TO THE PINS, swift-asn1 INCLUDED. DistrictCore pins
      # swift-crypto exactly, but swift-crypto takes swift-asn1 by range, so only the
      # `exactVersion` in project.yml holds it; a pin Xcode silently ignored would
      # resolve whatever is newest and still build. Every remote package declared with
      # `exactVersion` in project.yml must appear in the resolved file at that version.
      - name: Resolved versions match project.yml
        run: |
          python3 - <<'PY'
          import json, re, sys
          spec = open("project.yml").read()
          wanted = {
              m.group(1).rstrip("/").removesuffix(".git").rsplit("/", 1)[-1].lower(): m.group(2)
              for m in re.finditer(r"^\s+url:\s*(\S+)\s*\n\s+exactVersion:\s*\"?([^\s\"]+)\"?", spec, re.M)
          }
          path = "DistrictAI.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          pins = {p["identity"]: p["state"].get("version") for p in json.load(open(path))["pins"]}
          for identity, version in sorted(pins.items()):
              print(f"{identity} {version}")
          bad = [f"{i}: want {v}, resolved {pins.get(i)}" for i, v in sorted(wanted.items()) if pins.get(i) != v]
          if not wanted or bad:
              print("FATAL - resolution does not match the exactVersion pins in project.yml:")
              print("  " + ("\n  ".join(bad) or "no exactVersion pins found in project.yml"))
              sys.exit(1)
          print("all " + str(len(wanted)) + " exactVersion pins resolved as declared")
          PY

      - name: Choose a simulator
        run: ci/sim-udid.sh "$DEVICE"

      # ⛔ `generic/platform=iOS Simulator` BUILDS AGAINST THE SIMULATOR SDK WITHOUT
      # BOOTING ONE, and `CODE_SIGNING_ALLOWED=NO` is what lets every job here run with no
      # Apple account: a simulator build needs no certificate, profile or team.
      # The raw log is kept for the guards below; xcbeautify only formats the console.
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project DistrictAI.xcodeproj \
            -scheme DistrictAI \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log | xcbeautify --renderer github-actions
          grep -q '\*\* TEST BUILD SUCCEEDED \*\*' xcodebuild.log

      - name: DistrictAITests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project DistrictAI.xcodeproj \
            -scheme DistrictAI \
            -destination "id=$(cat simulator-udid.txt)" \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath SourcePackages \
            -resultBundlePath DistrictAITests.xcresult \
            -only-testing:DistrictAITests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild-test.log | xcbeautify --renderer github-actions

      # ⛔ A BUNDLE THAT DISCOVERS NOTHING REPORTS SUCCESS; a scheme edit that drops the
      # target from the test action would turn this job into a green no-op, and files
      # dropped from the target lose their tests just as quietly. The floor is a ratchet,
      # set a little below the count (486 on iPhone and iPad on 2026-10-01; about 472 after
      # the recording removal deleted 17 tests with the scheduler recordings, notes and
      # storage screens and added 3): raise it when tests are added, and lower it only in
      # the commit that deletes tests on purpose.
      - name: DistrictAITests were discovered
        run: |
          minimum=460
          executed=$(sed -n 's/.*Executed \([0-9]*\) tests\{0,1\}, with.*/\1/p' xcodebuild-test.log | sort -n | tail -1)
          echo "app-target tests executed - ${executed:-0} (at least $minimum expected)"
          if [ -z "$executed" ] || [ "$executed" -lt "$minimum" ]; then
            echo "FATAL - expected at least $minimum DistrictAITests, saw ${executed:-0}. A"
            echo "bundle that discovers nothing, or loses files, reports success, so this is"
            echo "a silent loss of the signal, not a pass."
            exit 1
          fi

      # ⛔ THE SIGNED-OUT SUBSET ONLY; no session ever reaches CI. These assert the state a
      # stranger meets. An unsigned build has no keychain entitlement, so the app lands on
      # its "Try again" state rather than "Sign in", which is why these tests address
      # elements by accessibility identifier.
      # ⛔ `-only-testing` IS AN ALLOW-LIST: a new signed-out class runs here only once it
      # is named here, and the count below moves with it.
      - name: Signed-out UI tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project DistrictAI.xcodeproj \
            -scheme DistrictAI \
            -destination "id=$(cat simulator-udid.txt)" \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath SourcePackages \
            -resultBundlePath DistrictAIUITests.xcresult \
            -only-testing:DistrictAIUITests/UnauthenticatedTests \
            -only-testing:DistrictAIUITests/LargerTextTests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild-uitest.log | xcbeautify --renderer github-actions

      # ⛔ COUNTS RATHER THAN CHECKING FOR ZERO. A dropped `-only-testing` line looks
      # exactly like a pass. The expected number is the sum of the cases in the classes
      # named above (UnauthenticatedTests 5 + LargerTextTests 2), AT LEAST rather than
      # exactly, so a case added to an existing class does not red the commit adding it.
      - name: UI tests were discovered
        run: |
          expected=7
          executed=$(sed -n 's/.*Executed \([0-9]*\) tests\{0,1\}, with.*/\1/p' xcodebuild-uitest.log | sort -n | tail -1)
          echo "ui tests executed - ${executed:-0} (expected at least $expected)"
          if [ -z "$executed" ] || [ "$executed" -lt "$expected" ]; then
            echo "FATAL - expected at least $expected UI tests, saw ${executed:-0}."
            echo "Either a -only-testing class was dropped from the list above, or the"
            echo "bundle discovered nothing. Both report success, so both are a silent"
            echo "loss of the signal rather than a pass."
            exit 1
          fi

      # The useful line in an xcodebuild failure is often far above the end of the log,
      # and the console above shows only xcbeautify's summary of it.
      - name: Tail the logs on failure
        if: failure()
        run: |
          for log in xcodebuild.log xcodebuild-test.log xcodebuild-uitest.log; do
            echo "=== last 200 lines of $log ==="
            tail -n 200 "$log" 2>/dev/null || echo "(no log written)"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: app-${{ matrix.device }}
          path: |
            xcodebuild*.log
            simulator-udid.txt
            *.xcresult
          if-no-files-found: warn
          retention-days: 7

  # ⛔ GITHUB'S DEPENDENCY GRAPH SEES NO SWIFT PACKAGE HERE ON ITS OWN: the project is
  # generated by XcodeGen and no Package.resolved is committed, so without this job the
  # graph holds the workflow actions only and "0 Dependabot alerts" means no Swift package
  # was looked at. `app` uploads the Package.resolved Xcode writes; this job submits its
  # pins as a snapshot through the dependency submission API, each one as
  # `pkg:swift/github.com/<owner>/<repo>@<version>`, the name the GitHub Advisory Database
  # files Swift advisories under, with the packages project.yml names marked direct.
  # dependency-review.yml waits for it (`retry-on-snapshot-warnings`) to compare a pull
  # request against `main`. Push to main and pull requests from this repository only: a
  # fork's pull request gets no token that can write a snapshot. The only job with a
  # write permission.
  dependency-graph:
    name: dependency graph
    needs: app
    if: ${{ !cancelled() && needs.app.result != 'skipped' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # POST /repos/{owner}/{repo}/dependency-graph/snapshots
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-resolved
          path: ${{ runner.temp }}/package-resolved

      - name: Submit the Swift package snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          RESOLVED: ${{ runner.temp }}/package-resolved/Package.resolved
          MANIFEST: project.yml
          SOURCE: project.yml
          CORRELATOR: swiftpm-package-resolved
          # A pull request's snapshot belongs to its head commit, which is what
          # dependency-review compares; GITHUB_SHA there is the test merge commit.
          SNAPSHOT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os, re, sys

          def identity(url):
              return url.rstrip("/").removesuffix(".git").rsplit("/", 1)[-1].lower()

          pins = json.load(open(os.environ["RESOLVED"]))["pins"]
          spec = open(os.environ["MANIFEST"]).read()
          direct = {identity(u) for u in re.findall(r'\burl:\s*"?(https://[^\s",)]+)', spec)}
          resolved = {}
          for pin in pins:
              state = pin.get("state", {})
              version = state.get("version") or state.get("revision")
              m = re.fullmatch(r"https://([^/]+)/(.+?)(?:\.git)?/?", pin.get("location", ""))
              if pin.get("kind") != "remoteSourceControl" or not m or not version:
                  print(f"::warning::{pin['identity']} not submitted: no remote URL and version")
                  continue
              purl = f"pkg:swift/{m.group(1).lower()}/{m.group(2)}@{version}"
              relationship = "direct" if pin["identity"] in direct else "indirect"
              resolved[pin["identity"]] = {"package_url": purl, "relationship": relationship, "scope": "runtime"}
              print(f"{purl} ({relationship})")
          missing = sorted(direct - resolved.keys())
          if not resolved or missing:
              print(f"FATAL - {os.environ['RESOLVED']} does not pin every package {os.environ['MANIFEST']} names: {missing}")
              sys.exit(1)
          server, repo, run = os.environ["GITHUB_SERVER_URL"], os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_RUN_ID"]
          source = os.environ["SOURCE"]
          snapshot = {
              "version": 0,
              "job": {"id": run, "correlator": os.environ["CORRELATOR"], "html_url": f"{server}/{repo}/actions/runs/{run}"},
              "sha": os.environ["SNAPSHOT_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "detector": {"name": "swiftpm-package-resolved", "version": "1.0.0", "url": f"{server}/{repo}/blob/main/.github/workflows/ci.yml"},
              "scanned": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "manifests": {source: {"name": source, "file": {"source_location": source}, "resolved": resolved}},
          }
          json.dump(snapshot, open(os.path.join(os.environ["RUNNER_TEMP"], "snapshot.json"), "w"), indent=2)
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" \
            --input "$RUNNER_TEMP/snapshot.json" >"$RUNNER_TEMP/response.json"
          cat "$RUNNER_TEMP/response.json"
          echo
          # ACCEPTED or SUCCESS; INVALID means the graph kept the previous snapshot.
          jq -e '.result != "INVALID"' "$RUNNER_TEMP/response.json" >/dev/null
