name: Dependency review

# Pull requests only: fails a PR that ADDS a dependency (any ecosystem GitHub's
# dependency graph reads, including an action) with a known moderate-or-worse
# vulnerability, or under a licence this Apache-2.0 project cannot ship. Mostly a guard
# on Dependabot's own PRs. Copied from district-macos's dependency-review.yml: the same
# action, pin and deny-list as bridgewatch's and district-linux's `dependency-review` job.
#
# It compares the two sides through the dependency graph API, so it checks nothing out.
on:
  pull_request:

permissions:
  contents: read

# Per pull request; a newer push supersedes the run in flight.
concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    # Long enough for the retry window below.
    timeout-minutes: 45
    steps:
      # ⚠️ THE SWIFT PACKAGES REACH THE GRAPH ONLY THROUGH ci.yml's `dependency graph` job,
      # which submits a snapshot for this pull request's head commit once the macOS `app`
      # job (both devices) has finished, about 25 minutes in. Until it lands the
      # comparison carries a snapshot warning and sees no Swift change, so the action
      # retries every 10 seconds for up to 40 minutes, then proceeds with what it has.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 2400
          fail-on-severity: moderate
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0-only, LGPL-3.0-or-later, SSPL-1.0, BUSL-1.1
