name: Release

# Builds, signs and uploads District AI to App Store Connect, from which TestFlight's
# internal group receives every valid build. Submission for App Review is a separate,
# explicitly approved step.
#
#   - A `v*` tag push builds and uploads that version. Nothing is submitted.
#   - A dispatch on `main` builds and uploads a TestFlight build of main. Nothing is
#     submitted, whatever the approval input says.
#   - A dispatch on a `v*` tag with the maintainers' approval input also submits the
#     build for review once it is valid, by calling submit.yml, which also runs on its
#     own for a tag that was already built.
#   - A dispatch with `build_only` archives and signs on the runner and stops there: no
#     upload to App Store Connect, no TestFlight build, no dSYM upload, no submission. It
#     proves a signed release build of the ref, and needs no approval.
#
# ⛔ NO SIGNING MATERIAL LIVES IN THIS REPOSITORY OR IN GITHUB. The `release` environment
# (branch `main` and tags `v*` only) is the one place a job can obtain a Google Cloud
# token: the workload identity provider admits only this repository, that environment and
# those refs, and the service account it maps to can read exactly the release secrets.
# Everything is fetched for one run and written under the runner's temporary directory,
# which is wiped with the job.
#
# No pull_request trigger of any kind: nothing a pull request contains can reach this
# workflow's credentials.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      approval:
        description: Leave empty for an upload only. Submission for review needs the maintainers' approval text and a v* tag.
        type: string
        default: ""
      build_only:
        description: Archive and sign only; upload nothing, submit nothing
        type: boolean
        default: false

# Nothing at the top level; each job asks for exactly what it uses.
permissions: {}

# One release run per ref at a time, and a running one is never cancelled: an upload cut
# off halfway leaves App Store Connect holding a build number nobody can reuse.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    # Explicit so every step gets `-eo pipefail`; the implicit default has no pipefail.
    shell: bash

jobs:
  build:
    name: build and upload
    runs-on: macos-26
    environment: release
    # The archive alone takes 10 to 20 minutes; the rest is App Store Connect processing.
    timeout-minutes: 120
    permissions:
      contents: read # check out the source
      id-token: write # the Google Cloud token for the release secrets
    outputs:
      version: ${{ steps.preflight.outputs.version }}
      build: ${{ steps.preflight.outputs.build }}
      kind: ${{ steps.preflight.outputs.kind }}
    env:
      SENTRY_CLI_VERSION: 3.8.0
      SENTRY_CLI_SHA256: 2c26914636c47ab9bf9e710484ad7b44d371cbec8bd29cafb36b3cf877bf4285
      SENTRY_ORG: distronode-corporation-eu
      # ⛔ FRENCH (fr-CA) SHIPS SINCE 3.0, AND THIS LINE IS WHAT THE ARCHIVE IS HELD TO.
      # project.yml puts App/Localization/fr-CA.lproj in every build; archive-imac.sh's
      # French guard reads this value: with "YES" an archive LACKING fr-CA.lproj's two
      # tables is deleted, and any other French .lproj is refused. "NO" would refuse every
      # archive now that French is always built in.
      DISTRICT_FRENCH: "YES"
    steps:
      # ⛔ THE WHOLE HISTORY. The build number is 4101 plus `git rev-list --count HEAD`,
      # and a shallow clone answers 1; the preflight refuses one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Refuses a tag that is not v<MARKETING_VERSION>, a tagged commit that is not on
      # main, and any branch but main, before anything is built or any secret is read.
      - name: Preflight
        id: preflight
        run: scripts/release-preflight.sh

      # The French is signed off per release. On a tag, every string catalog must be the
      # one i18n/fr-CA/signoff.json records (scripts/check-fr-signoff.py names each one
      # that is not), before anything is built or any secret is read. A dispatch on main
      # is a TestFlight build, never submitted, and is not checked. CONTRIBUTING.md,
      # "Strings and French".
      - name: The catalogs are the signed-off French
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/check-fr-signoff.py

      # The provider and the service account live in the action, shared with submit.yml.
      - name: Authenticate to Google Cloud
        id: gcp
        uses: ./.github/actions/release-auth # zizmor: ignore[self-repository]

      # ⛔ The .p8 is written once, mode 0600, under the runner's temporary directory,
      # every value masked first, and removed by the last step whatever happens. Fetched
      # this early because the next step needs it.
      - name: Fetch the App Store Connect key
        env:
          GSM_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          scripts/asc-key.sh "$RUNNER_TEMP/release"
          cat "$RUNNER_TEMP/release/asc.env" >>"$GITHUB_ENV"

      # The preflight again, now with the key, adding the one check that needs App Store
      # Connect: a build number it already has for this version (a tag of a commit a main
      # dispatch already uploaded) would be refused at the upload, after the whole archive.
      - name: Build number is unused
        env:
          RELEASE_CHECK_UPLOADED: "1"
        run: scripts/release-preflight.sh

      # The release scripts' own tests, so a broken script fails here rather than halfway
      # through an upload.
      - name: Release script tests
        run: |
          bash scripts/archive-imac.test.sh
          bash scripts/release-preflight.test.sh
          bash scripts/asc-key.test.sh
          bash scripts/github-release.test.sh
          python3 scripts/asc_release_test.py
          python3 scripts/asc_dev_cert_test.py

      # Xcode 26.3, asserted, and the pinned XcodeGen; archive-imac.sh generates the
      # project itself.
      - name: Xcode and XcodeGen
        uses: ./.github/actions/macos-toolchain # zizmor: ignore[self-repository]
        with:
          generate: "false"

      # Pinned by version and SHA-256, for the dSYM upload.
      - name: Install sentry-cli
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/sentry-cli" \
            "https://github.com/getsentry/sentry-cli/releases/download/${SENTRY_CLI_VERSION}/sentry-cli-Darwin-universal"
          echo "${SENTRY_CLI_SHA256}  $RUNNER_TEMP/bin/sentry-cli" | shasum -a 256 -c -
          chmod 0755 "$RUNNER_TEMP/bin/sentry-cli"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
          "$RUNNER_TEMP/bin/sentry-cli" --version

      # ⛔ THIS RUN'S OWN APPLE DEVELOPMENT CERTIFICATE, REVOKED BY THE LAST STEPS WHATEVER
      # HAPPENS. The archive signs with an Apple Development identity; a fresh runner has none,
      # and `-allowProvisioningUpdates` minted a new certificate on the team for every run,
      # which nothing revoked. scripts/asc_dev_cert.py creates one through App Store Connect
      # and records the id it answered BEFORE anything else can fail; the identity goes into a
      # keychain of this run's own, which Xcode finds and signs with. The revoke step deletes
      # exactly that id: never a listing, never a match by name, never another certificate.
      # ⚠️ Proven only on a release run (a build_only dispatch on main): nothing a pull request
      # runs can reach the `release` environment.
      - name: Create this run's Apple Development certificate
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/devcert"
          python3 scripts/asc_dev_cert.py create --dir "$dir"
          keychain="$dir/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$dir/key.pem" -k "$keychain" -t priv -T /usr/bin/codesign -T /usr/bin/security
          security import "$dir/cert.cer" -k "$keychain" -t cert
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          # Searched first, ahead of the user's own keychains, for this job only.
          existing="$(security list-keychains -d user | tr -d '"' | xargs)"
          # shellcheck disable=SC2086 # the existing list is a space-separated set of paths
          security list-keychains -d user -s "$keychain" $existing
          # The private key now lives only in the keychain, which the revoke step deletes.
          rm -f "$dir/key.pem"
          security find-identity -v -p codesigning "$keychain"

      # ⚠️ An `xcodebuild archive` on Xcode 26.3 has been seen to hang for good while
      # reaping the sentry-cocoa package's manifest helper (0% CPU, a defunct child). The
      # step timeout turns that into a red run; re-running it has always succeeded.
      - name: Archive and upload
        timeout-minutes: 75
        env:
          GSM_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          KIND: ${{ steps.preflight.outputs.kind }}
          EXPECTED_BUILD: ${{ steps.preflight.outputs.build }}
          BUILD_ONLY: ${{ inputs.build_only && '1' || '0' }}
        run: |
          set -euo pipefail
          SENTRY_DSN="$(scripts/gsm-secret.sh IOS_SENTRY_DSN)"
          echo "::add-mask::$SENTRY_DSN"
          export SENTRY_DSN
          if [ "$BUILD_ONLY" = "1" ]; then
            # ⛔ UPLOAD=0 stops archive-imac.sh after the signed archive; with no Sentry
            # token it uploads no dSYMs either. Nothing leaves the runner.
            export UPLOAD=0
          else
            SENTRY_AUTH_TOKEN="$(scripts/gsm-secret.sh SENTRY_EU_AUTH_TOKEN)"
            echo "::add-mask::$SENTRY_AUTH_TOKEN"
            export SENTRY_AUTH_TOKEN
          fi
          # The Google token is not needed past this point.
          unset GSM_ACCESS_TOKEN
          # A tag is a detached HEAD; the preflight has already proved its commit is on
          # main, which is what the script's branch check exists to establish.
          if [ "$KIND" = "tag" ]; then export ALLOW_BRANCH=1; fi
          BUILD_DIR="$RUNNER_TEMP/build" scripts/archive-imac.sh 2>&1 | tee "$RUNNER_TEMP/archive.log"
          grep -qx "build number: $EXPECTED_BUILD" "$RUNNER_TEMP/archive.log" || {
            echo "::error::the archive did not report build number $EXPECTED_BUILD"
            exit 1
          }

      # The proof a build-only run exists for: the archived app is validly signed, and by
      # whom.
      - name: Verify the signature (build only)
        if: ${{ inputs.build_only }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/build/DistrictAI.xcarchive/Products/Applications/DistrictAI.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E '^(Identifier|Authority|TeamIdentifier)='
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' -c 'Print :CFBundleVersion' "$APP/Info.plist"

      # Upload returns before App Store Connect has processed the build; this waits for
      # VALID, which is also when TestFlight's internal group receives it.
      - name: Wait for App Store Connect processing
        if: ${{ !inputs.build_only }}
        timeout-minutes: 45
        env:
          VERSION: ${{ steps.preflight.outputs.version }}
          BUILD: ${{ steps.preflight.outputs.build }}
        run: python3 scripts/asc_release.py wait-valid --version "$VERSION" --build "$BUILD" --timeout 2400

      - name: Summary
        if: success()
        env:
          VERSION: ${{ steps.preflight.outputs.version }}
          BUILD: ${{ steps.preflight.outputs.build }}
          KIND: ${{ steps.preflight.outputs.kind }}
          APPROVAL: ${{ inputs.approval }}
          EVENT: ${{ github.event_name }}
          BUILD_ONLY: ${{ inputs.build_only }}
        run: |
          {
            echo "### District AI $VERSION ($BUILD)"
            echo
            if [ "$BUILD_ONLY" = "true" ]; then
              echo "**Build only.** Archived and signed on the runner; nothing was uploaded or submitted."
              exit 0
            fi
            echo "Uploaded to App Store Connect and **VALID**. TestFlight internal testers receive it automatically."
            echo
            if [ "$EVENT" = "workflow_dispatch" ] && [ "$KIND" = "tag" ] && [ "$APPROVAL" = "approved for release" ]; then
              echo "Approved: the **submit** job submits it for App Review."
            elif [ "$KIND" = "tag" ]; then
              echo "**Not submitted for review.** It is uploaded and waiting for approval; submit it with submit.yml."
            else
              echo "**Not submitted for review.** A build of main is a TestFlight build only."
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      # ⛔ ALWAYS, AND BEFORE THE KEY IS REMOVED: the revoke needs the App Store Connect key.
      # Only the id this run's create step recorded is revoked; with no id recorded nothing
      # was created and nothing is sent. The keychain goes with it.
      - name: Revoke this run's Apple Development certificate
        if: always()
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/devcert"
          if [ -f "$dir/signing.keychain-db" ]; then
            security delete-keychain "$dir/signing.keychain-db" || true
          fi
          if [ ! -f "$dir/cert.id" ]; then
            echo "No certificate was created in this run; nothing to revoke."
            exit 0
          fi
          python3 scripts/asc_dev_cert.py revoke --dir "$dir"
          rm -rf "$dir"

      - name: Remove the key and the build
        if: always()
        run: rm -rf "$RUNNER_TEMP/release" "$RUNNER_TEMP/build" "$RUNNER_TEMP/archive.log"

  # The one submission path, submit.yml, called here rather than copied: it checks the
  # approval again, checks out the tag and runs scripts/release-submit.sh, then its
  # `github-release` job publishes the tag's GitHub Release if the version is on sale.
  submit:
    name: submit for review
    needs: build
    # ⛔ Only a dispatch on a tag, and only with the approval input exactly as the
    # maintainers give it. Anything else skips this job.
    if: github.event_name == 'workflow_dispatch' && needs.build.outputs.kind == 'tag' && inputs.approval == 'approved for release' && !inputs.build_only
    # The ceiling for submit.yml's jobs, each of which asks for no more than it uses:
    # `submit` reads, and only `github-release` writes.
    permissions:
      contents: write # submit.yml's github-release job publishes the Release
      id-token: write # the Google Cloud token for the App Store Connect key
    uses: ./.github/workflows/submit.yml # zizmor: ignore[self-repository]
    with:
      tag: ${{ github.ref_name }}
      approval: ${{ inputs.approval }}
