name: CodeQL

# Code scanning in ADVANCED setup, because default setup would analyse half the app and
# report success. Its Swift autobuilder looks for an .xcodeproj, and there is none in the
# repository (XcodeGen generates it from project.yml), so it falls back to
# `swift build --package-path Packages/DistrictCore`: every file under App/ stays out of
# the database and the job still passes. This workflow generates the project and builds
# the app itself, which compiles the App target and DistrictCore together.
#
# Two languages: `actions` reads the workflow files and needs no build; `swift` is traced
# through the `xcodebuild build` below.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so new queries in a CodeQL release reach code that has not changed.
    - cron: "17 6 * * 1"

# Nothing at the top level; the one job below asks for exactly what it uses.
permissions: {}

# Same shape as ci.yml: only pull requests cancel in flight. A superseded PR analysis is
# wasted macOS time; a superseded main analysis is the record for that commit.
concurrency:
  group: codeql-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # ⛔ SKIPPED WHILE THE REPOSITORY IS PRIVATE. Code scanning is not available to a
    # private repository on the free plan, so the upload would fail, and the swift leg
    # would first spend macOS minutes billed at 10x. `schedule` carries `repository` in
    # its payload too (since 2022), so the weekly run is guarded the same way.
    if: ${{ !github.event.repository.private }}
    runs-on: ${{ matrix.runs-on }}
    # Unmeasured on this repository: tracing slows the build, and the swift analysis
    # runs after it. Generous rather than tight.
    timeout-minutes: 120
    permissions:
      security-events: write # upload the results
      contents: read # check out the code
      actions: read # read this run's workflow details
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runs-on: ubuntu-latest
          # The same runner and Xcode as ci.yml's `app` job, so the analysed build is the
          # one CI tests. Xcode 26.3 ships Swift 6.2, inside CodeQL's supported range.
          - language: swift
            build-mode: manual
            runs-on: macos-26
    env:
      # Same values as ci.yml's `app` job. Bump both together.
      XCODE_APP: /Applications/Xcode_26.3.app
      XCODE_VERSION: "26.3"
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
      # Recommended by xcbeautify: without it xcodebuild buffers its output when piped.
      NSUnbufferedIO: "YES"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Asserted rather than trusted: an image rotation that drops this Xcode must fail
      # here, naming the reason, not later with a compiler error.
      - name: Select Xcode
        if: matrix.language == 'swift'
        run: |
          sudo xcode-select -s "$XCODE_APP"
          # Not `| head -n 1`: under pipefail with unbuffered output, xcodebuild aborts on
          # the closed pipe (exit 134). Read everything, keep the first line.
          have_all="$(xcodebuild -version)"
          have="${have_all%%$'\n'*}"
          echo "$have"
          if [ "$have" != "Xcode $XCODE_VERSION" ]; then
            echo "::error::expected Xcode $XCODE_VERSION at $XCODE_APP, got '$have'"
            exit 1
          fi

      # The upstream release zip, checked against a pinned SHA-256, rather than a
      # Homebrew formula whose version floats.
      - name: Install XcodeGen
        if: matrix.language == 'swift'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip
          sudo ./xcodegen/install.sh
          xcodegen --version

      # ⛔ THE PROJECT IS GENERATED, NEVER COMMITTED. project.yml is the source of truth.
      - name: xcodegen generate
        if: matrix.language == 'swift'
        run: xcodegen generate --spec project.yml

      # Every step after this one is traced, so the setup above stays out of it.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      # `xcodebuild build` of the DistrictAI scheme builds the app target and the local
      # DistrictCore package; the test bundles are `[test]` in project.yml, so they stay
      # out, as they do for the autobuilder. The five `=NO` settings are the ones GitHub's
      # Swift autobuilder passes. One architecture, as GitHub's build options for Swift
      # recommend: the runner's own. DerivedData, and with it the package checkouts
      # (LiveKit is compiled from source), sits outside the checkout.
      - name: Build the app
        if: matrix.language == 'swift'
        run: |
          set -o pipefail
          xcodebuild build \
            -project DistrictAI.xcodeproj \
            -scheme DistrictAI \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS="$(uname -m)" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILATION_CACHE_ENABLE_CACHING=NO \
            SWIFT_ENABLE_COMPILE_CACHE=NO \
            SWIFT_USE_INTEGRATED_DRIVER=NO 2>&1 | tee xcodebuild.log | xcbeautify --renderer github-actions
          grep -q '\*\* BUILD SUCCEEDED \*\*' xcodebuild.log

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
