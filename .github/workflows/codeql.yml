name: CodeQL

# Code scanning of the workflow files (CodeQL's `actions` language), in ADVANCED setup. It
# needs no build, runs on Linux in about a minute, and so runs on every pull request and
# on every push to main that changes a workflow or a local action.
# The Swift analysis is codeql-swift.yml: a traced build of the app on macOS, nightly and
# on demand (see there why it is a separate workflow).
on:
  push:
    branches: [main]
    # What the `actions` language reads. A push that touches neither has nothing new to
    # analyse.
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so new queries in a CodeQL release reach code that has not changed.
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Nothing at the top level; the job below asks for exactly what it uses.
permissions: {}

jobs:
  actions:
    name: Analyze (actions)
    # ⛔ SKIPPED WHILE THE REPOSITORY IS PRIVATE. Code scanning is not available to a
    # private repository on the free plan, so the upload would fail. `schedule` carries
    # `repository` in its payload too (since 2022), so the weekly run is guarded the same way.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Same shape as ci.yml: only pull requests cancel in flight. A superseded PR analysis is
    # wasted time; a superseded main analysis is the record for that commit.
    concurrency:
      group: codeql-actions-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      security-events: write # upload the results
      contents: read # check out the code
      actions: read # read this run's workflow details
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: actions
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:actions"
