name: Package pins

# Once a week, compares the Swift package pins in project.yml with their newest upstream
# releases and keeps ONE issue, "Swift package updates available", listing every pin that
# is behind (scripts/package_pins.py). Dependabot cannot do this here: the project is
# generated by XcodeGen, so there is no Package.swift for it to read. Nothing is bumped;
# each bump is its own reviewed pull request. Linux only, so no macOS runner is held.
on:
  schedule:
    # Mondays 07:23 UTC, early morning in Toronto, after the weekend's scans.
    - cron: "23 7 * * 1"
  workflow_dispatch:

# Nothing at the top level; the job below asks for exactly what it uses.
permissions: {}

concurrency:
  group: package-pins
  cancel-in-progress: false

jobs:
  pins:
    name: package pins
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out project.yml and the script
      issues: write # open, rewrite or close the one updates issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image's system Python usually has it (python3-yaml); installed only when not.
      - name: PyYAML for the pin check
        run: python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends python3-yaml; }

      - name: Script tests
        run: python3 scripts/package_pins_test.py

      - name: Compare the pins with upstream releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/package_pins.py --issue
