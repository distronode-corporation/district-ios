name: Submit for review

# Submits a version that release.yml has already built and uploaded from a `v*` tag.
# Runs only with the maintainers' explicit approval in the `approval` input; anything
# else fails at the first step and submits nothing.
#
# Dispatched on main (the `release` environment admits main and `v*` tags only), or
# called by release.yml's `submit` job on the tag it has just built: the one submission
# path. It checks out the tag, derives the same build number the release run did, and
# hands it to scripts/release-submit.sh.
#
# ⚠️ The tag's own tree supplies the scripts and .github/actions/release-auth, so a tag
# cut before that action existed (v1.2) cannot be submitted from here.
#
# The `github-release` job publishes a tag's GitHub Release once App Store Connect has the
# version on sale, never before (scripts/github-release.sh says why): after each
# submission for its tag, which publishes only if the version is already on sale, and on
# the schedule for every v* tag that has no Release yet, which is what catches Apple's
# approval. It runs from main's tree and CHANGELOG.md, whatever the tag's.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to submit, e.g. v1.3
        type: string
        required: true
      approval:
        description: The maintainers' approval text
        type: string
        required: true
  workflow_call:
    inputs:
      tag:
        description: The release tag to submit, e.g. v1.3
        type: string
        required: true
      approval:
        description: The maintainers' approval text
        type: string
        required: true

permissions: {}

# One submission at a time, never cancelled halfway. The schedule has its own group, so
# a scheduled run can never displace a submission waiting in the queue.
concurrency:
  group: submit-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  submit:
    name: submit for review
    # The schedule publishes Releases only; it never submits.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 90
    permissions:
      contents: read # check out the scripts and CHANGELOG.md
      id-token: write # the Google Cloud token for the App Store Connect key
    steps:
      # ⛔ FIRST, before any checkout or credential. The input arrives through env, never
      # interpolated into the script.
      - name: Approval
        env:
          APPROVAL: ${{ inputs.approval }}
        run: |
          if [ "$APPROVAL" != "approved for release" ]; then
            echo "::error::No approval was given. No submission was made."
            echo "**No submission was made:** the approval input was not the maintainers' approval." >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::tag '$TAG' is not of the form v<version>. No submission was made."
            exit 1
          fi

      # The whole history, for the build number, and main, for the preflight's ancestry
      # check. `ref` is the validated tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}

      - name: Preflight
        id: preflight
        env:
          RELEASE_REF_TYPE: tag
          RELEASE_REF_NAME: ${{ inputs.tag }}
        run: scripts/release-preflight.sh

      # The provider and the service account live in the action, shared with release.yml.
      - name: Authenticate to Google Cloud
        id: gcp
        uses: ./.github/actions/release-auth # zizmor: ignore[self-repository]

      - name: Submit for App Review
        env:
          GSM_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          VERSION: ${{ steps.preflight.outputs.version }}
          BUILD: ${{ steps.preflight.outputs.build }}
        run: scripts/release-submit.sh

  github-release:
    name: GitHub Release
    needs: submit
    # After a submission that went through, for its tag; on the schedule (which skips
    # `submit`), for every tag. A failed or refused submission publishes nothing.
    if: always() && (needs.submit.result == 'success' || (github.event_name == 'schedule' && needs.submit.result == 'skipped'))
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write # publish the Release
      id-token: write # the Google Cloud token for the App Store Connect key (read only here)
    # One at a time; a second for the same tag would find the first's Release and stop.
    concurrency:
      group: github-release
      cancel-in-progress: false
    steps:
      # main, whatever ref the run is on: its script and its CHANGELOG.md, which is final
      # by the time a version is on sale. The whole history and every tag, for the build
      # number.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: main

      # ⚠️ The workspace-relative form, as everywhere else here: actionlint refuses
      # zizmor's suggested `$/` form.
      - name: Authenticate to Google Cloud
        id: gcp
        uses: ./.github/actions/release-auth # zizmor: ignore[self-repository]

      - name: Publish the Release of a version on sale
        env:
          GH_TOKEN: ${{ github.token }}
          GSM_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          EVENT: ${{ github.event_name }}
          SUBMITTED_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            tags="$(git tag -l 'v*' --sort=v:refname)"
          else
            tags="$SUBMITTED_TAG"
          fi
          # Every tag is tried, so one refused tag cannot hold back the others; any
          # refusal still fails the run.
          status=0
          for tag in $tags; do
            TAG="$tag" scripts/github-release.sh || status=1
          done
          exit "$status"
