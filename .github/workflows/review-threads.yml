name: Review threads

# The organization's review threads check: a pull request is red while any review thread
# on it is unresolved, from any author (a person or a review bot), outdated or not. The
# workflow and its code are in distronode-corporation/.github, under
# `.github/workflows/review-threads.yml` and `.github/review-threads/`.
#
# The verdict is the commit status `review-threads` on the pull request's head commit,
# for a ruleset to require. The job (`review threads / record`) is not the check to
# require: it fails when it could not read or write, and on a fork's pull request when it
# finds an unresolved thread. A fork's run gets a read-only token, so it cannot write the
# status; failing its job shows the new thread at once, and that red job can stay until
# the next event, after the scheduled run has written the status.
# GitHub has no workflow event for a thread being resolved, so the scheduled run
# re-evaluates every open pull request and turns a resolved one green.
#
# In the merge queue there is no pull request to read: its threads were checked on the pull
# request before it could be queued (the ruleset requires them resolved). The `merge-queue`
# job writes the same `review-threads` status, success, on the queued commit, so the
# required check reports there too (as in district-assurance).
#
# Nothing from this repository is checked out or run.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

permissions: {}

# One run per pull request at a time (and one sweep), so the newest queued run reads the
# newest state. Each run reads every thread, so a superseded queued run loses nothing.
concurrency:
  group: review-threads-${{ github.event.pull_request.number || github.event.merge_group.head_ref || 'all' }}
  cancel-in-progress: false

jobs:
  review-threads:
    name: review threads
    if: github.event_name != 'merge_group'
    permissions:
      contents: read # the script's checkout
      pull-requests: read # open pull requests and their review threads
      statuses: write # the `review-threads` commit status
    uses: distronode-corporation/.github/.github/workflows/review-threads.yml@1b08fecf82b5b63650b4bcc4b2ef07198caf2f73 # merged commit of distronode-corporation/.github#22

  merge-queue:
    name: review threads (merge queue)
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write # the `review-threads` commit status on the queued commit
    steps:
      - name: Threads were checked on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Review threads were checked on the pull request before it was queued."
          gh api --method POST "repos/$REPO/statuses/$SHA" \
            -f state=success \
            -f context=review-threads \
            -f description="Threads were checked on the pull request"
