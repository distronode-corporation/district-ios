ctx = "body"
screen = "billing"
tier = "T1"
id = { swift = "BillingCopy.noCustomerBody" }

[billing.no_customer_title]
en = "No billing set up"
ctx = "title"
screen = "billing"
tier = "T1"
id = { swift = "BillingCopy.noCustomerTitle" }
note = "⛔ A DIFFERENT ANSWER FROM THE ONE ABOVE, AND THE TWO BODIES DIFFER ON THE WIRE BY ONE ABSENT KEY. This account has never had a Stripe customer, so nothing failed and no vendor was called. Wording it as an outage would invent a fault; wording the outage as this would tell a paying customer their billing was never set up."

[billing.other_workspace]
en = "These subscription and invoice details belong to another workspace on this account."
ctx = "body"
screen = "billing"
tier = "T1"
id = { swift = "BillingCopy.otherWorkspace" }
note = "⚠️ THE STRIPE HALF CAN BE ABOUT A DIFFERENT TENANT. When the active workspace carries no Stripe linkage the route falls through to another workspace of the same user and says so in ``StripeBilling/usageWorkspaceId``. Drawing those rows under this workspace's heading without a word would attribute a stranger's invoices to the tenant on screen."

[billing.overage_auto_bill]
en = "Extra minutes beyond your plan are billed automatically."
ctx = "body"
screen = "billing"
tier = "T1"
id = { swift = "BillingCopy.overageAutoBill" }

[billing.overage_blocked]
