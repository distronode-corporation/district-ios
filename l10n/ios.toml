[hq.composer_blocked]
en = "Confirm or dismiss the change above before asking something else."
fr = "Confirmez ou écartez le changement ci-dessus avant de poser une autre question."
ctx = "body"
screen = "hq"
state = "reviewed"
id = { swift = "HQCopy.composerBlocked" }
note = "⛔ WHY THE COMPOSER IS CLOSED WHILE A PROPOSAL IS ON SCREEN. Sending a new prompt would replace the console state and destroy the card, the summary and the pending write, with nothing recoverable: none of it is in the transcript and the confirm route accepts only a proposal that came back from a prompt. Both ways out are one tap on the card immediately above this line."

