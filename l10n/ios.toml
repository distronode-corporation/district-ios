id = { swift = "SchedulingSettingsWriteCopy.imageUnreadable" }
note = "⚠️ A DIFFERENT ANSWER FROM EITHER OF THOSE: the picker handed back nothing readable, which is not a rejected type and not a rejected size. Collapsing the three leaves an operator re-picking the same file."

