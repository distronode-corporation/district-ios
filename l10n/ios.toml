id = { swift = "AvailabilityCopy.rowSubtitle(_:)" }
note = "⛔ NAMES THE WORKSPACE, ALWAYS. It is a per-workspace fact about you, and an unqualified switch on an account screen reads as an account-wide setting — which would be wrong in the one direction that matters, since the same person can be available elsewhere."

[availability.row_title]
