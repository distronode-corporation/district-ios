id = { swift = "WorkflowsCopy.campaignPause" }

[workflows.campaign_pause_prompt]
en = "Pause the outbound campaign? The always-on SDR engine stops working through your contacts. Nothing is deleted, and the campaign goal and batch size are kept, so resuming picks up where it left off."
ctx = "placeholder"
screen = "workflows"
id = { swift = "WorkflowsCopy.campaignPausePrompt" }
note = "⛔ THE CONFIRMATIONS NAME THE CONSEQUENCE, NOT \"ARE YOU SURE\". A pause stops an engine that is working through a contact list right now; a resume starts spending call and message credit again. Two facts, two sentences."

[workflows.campaign_paused]
en = "Paused"
ctx = "label"
screen = "workflows"
id = { swift = "WorkflowsCopy.campaignPaused" }
note = "⚠️ \"Paused\", NOT \"Off\" OR \"Not set up\". A workspace that switched the campaign off and one that never opened the campaigns tab are the SAME value on the wire (the route normalises both), so the word has to be true of both."

[workflows.campaign_read_only]
en = "The campaign goal and batch size cannot be changed in this app."
ctx = "body"
screen = "workflows"
id = { swift = "WorkflowsCopy.campaignReadOnly" }
note = "⛔ NAMES WHAT THIS SCREEN CANNOT DO, AND NAMES NO DESTINATION FOR IT. Pausing merges ONE key through `workspace/campaign-status`; the goal and the batch size are written by `campaign-settings`, which rebuilds all three fields from its body, so a phone editing either of those would have to send all of them. Without this line the single button reads as a half-built settings form. ⚠️ It must not name the website: Guideline 3.1.1 makes that steering."

[workflows.campaign_read_only_viewer]
en = "You are in this workspace as a viewer. Ask an agency or client member to change the campaign."
ctx = "body"
screen = "workflows"
id = { swift = "WorkflowsCopy.campaignReadOnlyViewer" }
note = "⚠️ A VIEWER SENT TO THE WEB DASHBOARD WOULD BE REFUSED THERE TOO, so they are told who can change it instead."

