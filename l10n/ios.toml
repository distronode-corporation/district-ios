[billing.read_only]
en = "Plan changes, payment methods and cancellations are not available in this app. This screen is read-only."
ctx = "body"
screen = "billing"
tier = "T1"
id = { swift = "BillingCopy.readOnly" }
note = "⛔ THE CAPTION THAT MAKES THE ABSENCE OF CONTROLS DELIBERATE, and it is a store requirement rather than a courtesy: a plan card with no upgrade button reads as a half-built screen unless it says the change cannot be made here.\n⛔ IT NAMES NOWHERE, NOT EVEN distronode.com. A tappable route to a purchase flow is what Guideline 3.1.3(b) prohibits; naming the destination in prose is what 3.1.1 prohibits. Stating the limitation breaks neither."

[billing.read_only_viewer]
en = "This screen is read-only. Ask an agency or client member of this workspace to change the plan."
ctx = "body"
screen = "billing"
tier = "T1"
id = { swift = "BillingCopy.readOnlyViewer" }
note = "⚠️ A VIEWER CANNOT MAKE THE CHANGE ANYWHERE, so the sentence names who can rather than what to do. The same call the marketplace makes."

