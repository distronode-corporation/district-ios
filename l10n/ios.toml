ctx = "body"
screen = "billing"
tier = "T1"
id = { swift = "BillingCopy.overageBlocked" }
note = "⛔ TWO SENTENCES FOR ONE FLAG, AND THE DIFFERENCE IS AN OUTAGE. Under a hard cap an exceeded allowance means calls are being REFUSED right now, which the operator has no other way to learn from this app; under auto-bill it is a charge. See ``WorkspaceBilling/callsAreBeingRefused``."

[billing.overage_exceeded]
