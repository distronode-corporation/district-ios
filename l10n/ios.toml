en = "This workspace has never chosen which capabilities are on, so they all are. Choosing them here would switch off anything District AI has added since this version of the app shipped, so the first choice cannot be made in this app. After that they can be changed here."
fr = "Cet espace de travail n'a jamais choisi quelles capacités sont activées\u00A0: elles le sont donc toutes. Les choisir ici désactiverait tout ce que District AI a ajouté depuis la sortie de cette version de l'app; ce premier choix ne peut donc pas se faire dans cette app. Ensuite, elles pourront être modifiées ici."
ctx = "body"
screen = "settings"
state = "reviewed"
id = { swift = "SettingsCopy.capabilitiesNoStoredList" }
note = "⛔ WHY A WORKSPACE THAT HAS NEVER STORED A LIST CANNOT BE SAVED FROM A PHONE, AND IT IS THE SAME WHOLESALE-REPLACE HAZARD THE REST OF THIS SURFACE IS BUILT AROUND. `PATCH workspace/tools` stores exactly the array it receives, so a FIRST save from here would store exactly what this build can name — and a capability District AI added after this build shipped would be switched off by someone who never saw it. Only a surface that ships from the same deploy as the route can be trusted with the FIRST choice, which is why this build refuses it. ⚠️ IT NAMES NOWHERE ELSE TO MAKE THAT CHOICE (Guideline 3.1.1 forbids steering); the refusal and its reason are what the operator needs. ⚠️ SAYS \"every capability is on\" rather than listing them: this build cannot enumerate what it has not learned, and pretending otherwise here would be the same claim in words that the save would have made in data."

