[scheduling_team_write.archive_blocked]
en = "Reassign or cancel their upcoming bookings first."
fr = "Réattribuez ou annulez d'abord ses rendez-vous à venir."
ctx = "body"
screen = "scheduling.writes.team"
tier = "T2"
state = "reviewed"
id = { swift = "SchedulingTeamWriteCopy.archiveBlocked" }
note = "⛔ THE ARCHIVE IS BLOCKED UNTIL THE UPCOMING-BOOKING COUNT HAS BEEN READ AND IS ZERO, WHICH IS THE WEB'S `canArchive` AND NOT A CAUTION OF OUR OWN. The fork refuses with a 409 while the user still hosts anything, so offering the button before the read has landed offers a refusal."

[scheduling_team_write.archive_body]
en = "They can no longer sign in, they are skipped in routing, and their event types stop taking bookings. The account is kept."
fr = "Cette personne ne pourra plus se connecter, sera exclue de l'acheminement et ses types de rendez-vous ne seront plus réservables. Le compte est conservé."
ctx = "body"
screen = "scheduling.writes.team"
tier = "T2"
state = "reviewed"
id = { swift = "SchedulingTeamWriteCopy.archiveBody" }
note = "⚠️ SAYS WHAT A SOFT DELETE ACTUALLY DOES. The row and its links survive; the member cannot sign in, is skipped in routing, and their event types are deactivated. \"Delete\" would be the wrong word and the wrong expectation."

