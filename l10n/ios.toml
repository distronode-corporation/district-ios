note = "⛔ REPLACES ``confirmNote`` ONCE A CONFIRM HAS FAILED, BECAUSE THAT SENTENCE IS NO LONGER KNOWN TO BE TRUE. A confirm that timed out may already have executed server-side — it is the reason nothing retries one automatically — so keeping \"Nothing has been changed yet.\" directly above a button labelled \"Confirm again\" would contradict the button. This says what the button's label already implies."

[hq.confirm_note]
en = "Nothing has been changed yet."
ctx = "body"
screen = "hq"
id = { swift = "HQCopy.confirmNote" }
note = "⛔ THE LOAD-BEARING SENTENCE ON THIS WHOLE SCREEN. The answer above the card says a change was PROPOSED; without this line a proposal reads as a completed action and the operator leaves believing it was applied. It is the client half of the server's own rule that a write happens only on an explicit second call.\n⛔ AND IT IS TRUE ONLY BEFORE THE FIRST CONFIRM. After one fails it becomes a claim nobody can make, which is why ``confirmFailedNote`` replaces it rather than sitting beside it. See ``HQConsoleState/confirmFailed(_:_:)``."

