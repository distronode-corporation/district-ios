screen = "hq"
id = { swift = "HQCopy.empty" }
note = "⚠️ NAMES THE FOUR THINGS THE TOOL CATALOG CAN ANSWER FROM. A vaguer invitation (\"ask me anything\") sets up questions the tools cannot serve, and the model is instructed to refuse rather than invent, so the empty state would be generating its own dead ends."

