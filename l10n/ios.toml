[scheduling_team_write.archive_refused]
en = "That account could not be archived. It may still hold upcoming bookings, it may be the workspace owner, or it may be archived already."
fr = "Ce compte n'a pas pu être archivé. Il se peut qu'il ait encore des rendez-vous à venir, qu'il soit celui du propriétaire de l'espace de travail ou qu'il soit déjà archivé."
ctx = "error"
screen = "scheduling.writes.team"
tier = "T2"
state = "reviewed"
id = { swift = "SchedulingTeamWriteCopy.archiveRefused" }
note = "⛔ ENUMERATES BECAUSE THIS CLIENT CANNOT TELL THE FOUR REFUSALS APART. The fork answers 409 (still hosting bookings), 403 (not the owner), 400 (is the workspace owner, or already archived) and 404 (gone), and every one of them arrives as ``SchedulingAdminError/unknown`` — the status is collapsed by `error(forStatus:code:)` before a screen sees it. The web writes four sentences because the browser still holds the number. Naming one of them here would be a guess presented as a fact; naming all of them is true."

