note = "⚠️ THE \"$\" IS THIS CLIENT MIRRORING THE WEB CONSOLE. Nothing on `/api/billing` carries a currency, so the assumption lives here, in one place, rather than being concatenated beside every amount."

[billing.money_monthly]
