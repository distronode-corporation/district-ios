note = "⛔ NOT A PERMISSION PROBLEM AND NOT AN ERROR. The person holds their role through the workspace's owner fallback, so there is no membership row to set — and the ring fan-out reads exactly that table. The remedy is somebody adding them properly, which is what this sentence asks for."

