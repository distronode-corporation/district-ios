note = "⛔ NOT \"Free\". ``WorkspaceBilling/subscriptionTier`` is nullable and this route passes null through untouched; `GET /api/settings` substitutes a capitalised \"Free\" and this one deliberately does not. Inventing the word here would put a plan name on screen that no database row contains."

