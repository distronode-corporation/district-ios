[meta]
catalog = "watch"
platform = "swift"
apple = true

[watch.action_items]
en = "Action items"
fr = "Actions à faire"
ctx = "label"
screen = "watch"
state = "reviewed"
id = { swift = "WatchCopy.actionItems" }
note = "Label over the call's action items. Same as the iPhone's calls.action_items."

[watch.availability]
en = "Availability"
fr = "Disponibilité"
ctx = "title"
screen = "complication"
state = "reviewed"
id = { swift = "WatchCopy.availability" }
note = "The complication's name in the watch-face editor."

[watch.availability_description]
en = "Shows whether calls ring to you."
fr = "Indique si les appels sonnent pour vous."
ctx = "body"
screen = "complication"
state = "reviewed"
id = { swift = "WatchCopy.availabilityDescription" }
note = "The complication's description in the watch-face editor."

[watch.availability_failed]
en = "Availability not changed"
fr = "Disponibilité non modifiée"
ctx = "error"
screen = "watch"
state = "reviewed"
id = { swift = "WatchCopy.availabilityFailed" }
note = "Title over the iPhone's reason when the watch's Available for calls switch did not go through."

[watch.availability_unreadable]
en = "Could not read whether calls ring to you."
fr = "Impossible de savoir si les appels sonnent pour vous."
ctx = "body"
screen = "watch"
state = "reviewed"
id = { swift = "WatchCopy.availabilityUnreadable" }
note = "The iPhone could not read the availability. Same sentence as the iPhone's availability.load_failed."

[watch.available]
en = "Available"
fr = "Disponible"
ctx = "label"
screen = "complication"
state = "reviewed"
id = { swift = "WatchCopy.available" }
note = "Watch-face complication: calls ring to you in the workspace named beside it."

[watch.available_for_calls]
en = "Available for calls"
fr = "Disponible pour les appels"
ctx = "label"
screen = "watch"
state = "reviewed"
id = { swift = "WatchCopy.availableForCalls" }
note = "The watch's switch. Same words as the iPhone's availability row."

[watch.available_in]
en = "Available · {workspace}"
fr = "Disponible · {workspace}"
ctx = "label"
screen = "complication"
args = { workspace = "str" }
state = "reviewed"
id = { swift = "WatchCopy.availableIn(_:)" }
note = "Inline watch-face complication. {workspace} is the workspace's name."

[watch.call_back]
en = "Call back on iPhone"
fr = "Rappeler sur l'iPhone"
ctx = "button"
screen = "watch"
state = "reviewed"
id = { swift = "WatchCopy.callBack" }
note = "Hands the call over to the iPhone (Handoff), which opens its dialler with the caller's number filled in. Nothing is dialled from the watch."

[watch.call_back_hint]
en = "On your iPhone, open the App Switcher and tap District AI."
fr = "Sur votre iPhone, ouvrez le sélecteur d'app et touchez District AI."
ctx = "body"
screen = "watch"
state = "reviewed"
id = { swift = "WatchCopy.callBackHint" }
note = "After Call back on iPhone: where the handed-over call appears on the iPhone (the banner at the bottom of the App Switcher)."

[watch.call_title]
en = "Call summary"
fr = "Résumé de l'appel"
ctx = "title"
screen = "watch"
state = "reviewed"
id = { swift = "WatchCopy.callTitle" }
note = "Title of one call's card: who, how it went, the AI summary and the action items."

[watch.calls]
en = "Calls"
fr = "Appels"
ctx = "title"
screen = "watch"
state = "reviewed"
id = { swift = "WatchCopy.calls" }

[watch.calls_in]
en = "Calls in {workspace}"
fr = "Appels de l'espace {workspace}"
ctx = "label"
screen = "watch"
args = { workspace = "str" }
state = "reviewed"
id = { swift = "WatchCopy.callsIn(_:)" }
note = "Under the Available for calls switch: which workspace it is about. {workspace} is the workspace's name."

[watch.canned_call_back]
en = "I'll call you back shortly."
fr = "Je vous rappelle sous peu."
ctx = "button"
screen = "watch"
state = "reviewed"
id = { swift = "WatchCopy.cannedCallBack" }
note = "A ready-made reply, sent as written to a customer by SMS or email."

[watch.canned_cant_talk]
en = "I can't talk right now. I'll reply soon."
fr = "Je ne peux pas parler pour l'instant. Je vous réponds bientôt."
ctx = "button"
screen = "watch"
state = "reviewed"
id = { swift = "WatchCopy.cannedCantTalk" }
note = "A ready-made reply, sent as written to a customer by SMS or email."

[watch.canned_on_my_way]
en = "On my way."
fr = "J'arrive."
ctx = "button"
screen = "watch"
state = "reviewed"
id = { swift = "WatchCopy.cannedOnMyWay" }
note = "A ready-made reply, sent as written to a customer by SMS or email."

[watch.canned_thanks]
en = "Thanks, got it."
fr = "Merci, bien reçu."
ctx = "button"
screen = "watch"
state = "reviewed"
id = { swift = "WatchCopy.cannedThanks" }
note = "A ready-made reply, sent as written to a customer by SMS or email."

[watch.cannot_reply]
en = "This conversation has no channel to reply on."
fr = "Aucun canal de réponse pour cette conversation."
ctx = "body"
screen = "watch"
state = "reviewed"
id = { swift = "WatchCopy.cannotReply" }
note = "Shown instead of the reply buttons when the server offers no SMS or email address for the thread."

[watch.could_not_load]
en = "Your iPhone could not load this. Open District AI on your iPhone."
fr = "Votre iPhone n'a pas pu charger cette liste. Ouvrez District AI sur votre iPhone."
ctx = "body"
screen = "watch"
state = "reviewed"
id = { swift = "WatchCopy.couldNotLoad" }
note = "A list the iPhone could not read. Not the same as an empty list."

[watch.dictate_reply]
en = "Write a reply"
fr = "Écrire une réponse"
ctx = "placeholder"
screen = "watch"
state = "reviewed"
id = { swift = "WatchCopy.dictateReply" }
note = "The watch's text field for a reply: dictation, Scribble or the keyboard."

[watch.duration]
en = "Duration"
fr = "Durée"
ctx = "label"
screen = "watch"
state = "reviewed"
id = { swift = "WatchCopy.duration" }

[watch.inbox]
en = "Inbox"
fr = "Réception"
ctx = "title"
screen = "watch"
state = "reviewed"
fr_variant = "Watch screen title, the same word as the iPhone tab: Apple Mail's own French for Inbox; « Boîte de réception » does not fit the watch's title"
id = { swift = "WatchCopy.inbox" }

[watch.intent_availability_off]
en = "Calls in {workspace} no longer ring your phone."
fr = "Les appels de l'espace {workspace} ne sonnent plus sur votre téléphone."
ctx = "body"
screen = "intents"
args = { workspace = "str" }
state = "draft"
id = { swift = "WatchCopy.intentAvailabilityOff(_:)" }
note = "Siri or Shortcuts answer on the watch after « Set my availability » turned calls off."

[watch.intent_availability_on]
en = "Calls in {workspace} now ring your phone."
fr = "Les appels de l'espace {workspace} sonnent maintenant sur votre téléphone."
ctx = "body"
screen = "intents"
args = { workspace = "str" }
state = "draft"
id = { swift = "WatchCopy.intentAvailabilityOn(_:)" }
note = "Siri or Shortcuts answer on the watch after « Set my availability » turned calls on. Same words as the iPhone's intent.availability_on."

[watch.intent_latest_inbound]
en = "Latest message · {name}: {text}"
fr = "Dernier message · {name}\u00A0: {text}"
ctx = "body"
screen = "intents"
args = { name = "str", text = "str" }
state = "draft"
id = { swift = "WatchCopy.intentLatestInbound(_:text:)" }
note = "« Read my latest message » on the watch. Same words as the iPhone's intent.latest_inbound."

[watch.intent_latest_outbound]
en = "Your latest reply · {name}: {text}"
fr = "Votre dernière réponse · {name}\u00A0: {text}"
ctx = "body"
screen = "intents"
args = { name = "str", text = "str" }
state = "draft"
id = { swift = "WatchCopy.intentLatestOutbound(_:text:)" }
note = "« Read my latest message » on the watch, when the newest message was sent by the business."

[watch.intent_no_messages]
en = "There are no messages in your inbox."
fr = "Votre boîte de réception ne contient aucun message."
ctx = "body"
screen = "intents"
state = "draft"
id = { swift = "WatchCopy.intentNoMessages" }
note = "« Read my latest message » on the watch with an empty inbox."

[watch.iphone_did_not_answer]
en = "Your iPhone did not answer. Try again."
fr = "Votre iPhone n'a pas répondu. Réessayez."
ctx = "error"
screen = "watch"
state = "reviewed"
id = { swift = "WatchCopy.iphoneDidNotAnswer" }
note = "The message reached no answer in time. The write may or may not have happened."

[watch.iphone_not_reachable]
en = "iPhone not reachable"
fr = "iPhone injoignable"
ctx = "error"
screen = "watch"
state = "reviewed"
id = { swift = "WatchCopy.iphoneNotReachable" }

[watch.iphone_not_reachable_body]
en = "Keep your iPhone nearby and try again."
fr = "Gardez votre iPhone à proximité et réessayez."
ctx = "body"
screen = "watch"
state = "reviewed"
id = { swift = "WatchCopy.iphoneNotReachableBody" }

[watch.live_call]
en = "Live call"
fr = "Appel en cours"
ctx = "label"
screen = "watch"
state = "reviewed"
id = { swift = "WatchCopy.liveCall" }
note = "Home: a row per call in progress in the workspace, opening its live transcript."

[watch.live_connecting]
en = "Connecting…"
fr = "Connexion…"
ctx = "label"
screen = "watch"
state = "reviewed"
id = { swift = "WatchCopy.liveConnecting" }
note = "Live transcript status: waiting for the first words. Same as the iPhone's live_transcript.connecting."

[watch.live_ended]
en = "Call ended"
fr = "Appel terminé"
ctx = "label"
screen = "watch"
state = "reviewed"
id = { swift = "WatchCopy.liveEnded" }
note = "Live transcript status: the call is over; the card opens next. Same as the iPhone's live_transcript.ended."

[watch.live_incomplete]
