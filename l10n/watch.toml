screen = "watch"
state = "reviewed"
id = { swift = "WatchCopy.liveIncomplete" }
note = "The server no longer holds the call's first lines. Same as the iPhone's live_transcript.incomplete."

[watch.live_now]
en = "Live"
fr = "En direct"
ctx = "label"
screen = "watch"
state = "reviewed"
id = { swift = "WatchCopy.liveNow" }
note = "Live transcript status: lines arrive as they are spoken. Same as the iPhone's live_transcript.live."

