[meta]
catalog = "infoplist"
platform = "swift"
apple = true

[infoplist.camera_usage]
en = "District AI uses the camera only in meeting rooms you join, never on phone calls."
fr = "District AI n'utilise la caméra que dans les salles de réunion que vous rejoignez, jamais lors des appels."
ctx = "legal"
screen = "permissions"
tier = "T0"
state = "reviewed"
id = { apple = "NSCameraUsageDescription" }
note = "The iOS camera permission prompt. Must stay true for both surfaces: the softphone publishes no video in either direction. Must equal project.yml's Info.plist value."

[infoplist.microphone_usage]
en = "District AI uses the microphone for calls you place and answer."
fr = "District AI utilise le microphone pour vos appels passés ou reçus."
ctx = "legal"
screen = "permissions"
tier = "T0"
state = "reviewed"
id = { apple = "NSMicrophoneUsageDescription" }
note = "The iOS microphone permission prompt. Must equal project.yml's Info.plist value."
